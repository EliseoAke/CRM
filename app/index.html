<style>
  [x-cloak]{display:none!important}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .tbl th{position:sticky;top:0;background:#f8fafc;z-index:1}
  .chip{display:inline-block;padding:.1rem .5rem;border-radius:999px;font-size:.72rem;font-weight:600;white-space:nowrap}
  .bar{height:.6rem;border-radius:.3rem}
  @media print{.no-print{display:none!important}}
</style>
</head>
<body class="bg-slate-100 text-slate-800">
<div x-data="erp()" x-init="init()" x-cloak class="min-h-screen">

  <!-- ============ LOGIN ============ -->
  <div x-show="!ready" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-lg w-full max-w-md p-8">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-11 h-11 rounded-xl bg-teal-600 text-white grid place-items-center font-black text-xl">M</div>
        <div><div class="text-xl font-bold">Mayalink ERP</div><div class="text-sm text-slate-500">CRM · Finanzas · Contabilidad · RRHH · Soporte</div></div>
      </div>
      <label class="block text-sm font-medium mb-1">URL de la API (n8n)</label>
      <input x-model="cfg.api" class="w-full border rounded-lg px-3 py-2 mb-3 text-sm" placeholder="https://tu-n8n.com/webhook/mayalink/api">
      <label class="block text-sm font-medium mb-1">Clave de acceso</label>
      <input x-model="cfg.token" type="password" @keydown.enter="login()" class="w-full border rounded-lg px-3 py-2 mb-4 text-sm" placeholder="mlk_…">
      <button @click="login()" class="w-full bg-teal-600 hover:bg-teal-700 text-white rounded-lg py-2.5 font-semibold" :disabled="busy" x-text="busy?'Conectando…':'Entrar'"></button>
      <p class="text-red-600 text-sm mt-3" x-text="loginError"></p>
      <div class="border-t mt-6 pt-4 text-center">
        <button @click="startDemo()" class="text-teal-700 text-sm font-medium hover:underline">Probar en modo demostración (datos de ejemplo en este navegador)</button>
      </div>
    </div>
  </div>

  <!-- ============ APP ============ -->
  <div x-show="ready" class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="no-print bg-slate-900 text-slate-200 w-60 shrink-0 hidden md:flex flex-col" :class="menuOpen && '!flex fixed inset-y-0 left-0 z-40'">
      <div class="flex items-center gap-2 px-5 h-16 border-b border-slate-800">
        <div class="w-8 h-8 rounded-lg bg-teal-500 text-white grid place-items-center font-black">M</div>
        <div class="font-bold text-white">Mayalink ERP</div>
      </div>
      <nav class="flex-1 overflow-y-auto py-3">
        <template x-for="m in modules" :key="m.id">
          <button @click="go(m.id)" class="w-full flex items-center gap-3 px-5 py-2.5 text-sm text-left hover:bg-slate-800"
                  :class="mod===m.id && 'bg-slate-800 text-white border-l-4 border-teal-400 !pl-4'">
            <span class="w-5 text-center" x-text="m.icon"></span><span x-text="m.label"></span>
          </button>
        </template>
      </nav>
      <div class="px-5 py-3 text-xs text-slate-400 border-t border-slate-800">
        <div x-show="cfg.demo" class="text-amber-300 font-semibold">Modo demostración</div>
        <div x-show="!cfg.demo">Conectado a n8n</div>
        <button @click="logout()" class="mt-1 hover:text-white">Cerrar sesión</button>
      </div>
    </aside>
    <div x-show="menuOpen" @click="menuOpen=false" class="fixed inset-0 bg-black/40 z-30 md:hidden"></div>

    <main class="flex-1 min-w-0">
      <header class="no-print bg-white border-b h-16 flex items-center gap-3 px-4 md:px-6 sticky top-0 z-20">
        <button class="md:hidden text-2xl" @click="menuOpen=true">☰</button>
        <h1 class="text-lg font-bold flex-1 truncate" x-text="curModule().label"></h1>
        <span x-show="busy" class="text-xs text-slate-500">Guardando…</span>
        <button @click="loadAll()" class="text-sm border rounded-lg px-3 py-1.5 hover:bg-slate-50" title="Recargar datos">↻ Actualizar</button>
      </header>

      <div class="p-4 md:p-6 flex flex-col gap-5">

        <!-- ======== PESTAÑAS DEL MÓDULO ======== -->
        <template x-if="curModule().tabs && curModule().tabs.length>1">
          <div class="flex flex-wrap gap-1 no-print">
            <template x-for="t in curModule().tabs" :key="t">
              <button @click="tab=t" class="px-4 py-2 text-sm rounded-lg" :class="tab===t?'bg-teal-600 text-white':'bg-white hover:bg-slate-50 border'" x-text="tabLabel(t)"></button>
            </template>
          </div>
        </template>

        <!-- ======== TABLERO ======== -->
        <template x-if="mod==='tablero'">
          <div class="space-y-5">
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
              <template x-for="k in kpis()" :key="k.l">
                <div class="bg-white rounded-xl shadow-sm p-4">
                  <div class="text-xs uppercase tracking-wide text-slate-500" x-text="k.l"></div>
                  <div class="text-2xl font-bold mt-1" :class="k.c||''" x-text="k.v"></div>
                  <div class="text-xs text-slate-500 mt-1" x-text="k.s||''"></div>
                </div>
              </template>
            </div>
            <div class="grid lg:grid-cols-2 gap-5">
              <div class="bg-white rounded-xl shadow-sm p-5">
                <div class="font-semibold mb-3">Ingresos vs egresos (últimos 6 meses)</div>
                <template x-for="r in flujoMensual()" :key="r.mes">
                  <div class="mb-3">
                    <div class="flex justify-between text-xs mb-1"><span x-text="r.mes"></span><span><span class="text-emerald-700" x-text="money(r.ing)"></span> · <span class="text-rose-700" x-text="money(r.egr)"></span></span></div>
                    <div class="bar bg-emerald-500 mb-0.5" :style="'width:'+pct(r.ing,r.max)+'%'"></div>
                    <div class="bar bg-rose-400" :style="'width:'+pct(r.egr,r.max)+'%'"></div>
                  </div>
                </template>
              </div>
              <div class="bg-white rounded-xl shadow-sm p-5">
                <div class="font-semibold mb-3">Clientes por plan</div>
                <template x-for="r in clientesPorPlan()" :key="r.plan">
                  <div class="mb-3">
                    <div class="flex justify-between text-xs mb-1"><span x-text="r.plan"></span><span x-text="r.n+' clientes · '+money(r.mrr)+'/mes'"></span></div>
                    <div class="bar bg-teal-500" :style="'width:'+pct(r.n,r.max)+'%'"></div>
                  </div>
                </template>
                <div x-show="!clientesPorPlan().length" class="text-sm text-slate-500">Aún no hay clientes activos.</div>
              </div>
              <div class="bg-white rounded-xl shadow-sm p-5">
                <div class="flex justify-between mb-3"><span class="font-semibold">Facturas vencidas</span><button class="text-sm text-teal-700" @click="go('facturas')">Ver todas →</button></div>
                <template x-for="f in (db.facturas||[]).filter(x=>x.estado==='vencida').slice(0,8)" :key="f.id">
                  <div class="flex justify-between text-sm py-1.5 border-b last:border-0"><span x-text="refName('clientes',f.cliente_id)"></span><span class="font-medium text-rose-700" x-text="money(f.total)"></span></div>
                </template>
                <div x-show="!(db.facturas||[]).some(x=>x.estado==='vencida')" class="text-sm text-slate-500">Sin facturas vencidas 🎉</div>
              </div>
              <div class="bg-white rounded-xl shadow-sm p-5">
                <div class="flex justify-between mb-3"><span class="font-semibold">Tickets abiertos</span><button class="text-sm text-teal-700" @click="go('soporte')">Ver todos →</button></div>
                <template x-for="t in ticketsAbiertos().slice(0,8)" :key="t.id">
                  <div class="flex justify-between items-center text-sm py-1.5 border-b last:border-0 gap-2"><span class="truncate" x-text="(t.folio||'')+' · '+t.asunto"></span><span class="chip" :class="chipClass('prioridad',t.prioridad)" x-text="t.prioridad"></span></div>
                </template>
                <div x-show="!ticketsAbiertos().length" class="text-sm text-slate-500">Sin tickets abiertos.</div>
              </div>
            </div>
          </div>
        </template>

        <!-- ======== CRM KANBAN ======== -->
        <template x-if="mod==='crm' && crmView==='kanban'">
          <div>
            <div class="flex flex-wrap gap-2 mb-4">
              <button @click="openForm('prospectos')" class="bg-teal-600 text-white rounded-lg px-4 py-2 text-sm font-semibold">+ Nuevo prospecto</button>
              <button @click="crmView='lista'" class="border rounded-lg px-4 py-2 text-sm bg-white">Ver como lista</button>
              <div class="text-sm text-slate-500 self-center ml-auto">Pipeline abierto: <b x-text="money(pipelineValor())"></b>/mes</div>
            </div>
            <div class="flex gap-4 overflow-x-auto pb-4">
              <template x-for="et in field('prospectos','etapa').op" :key="et">
                <div class="bg-slate-200/70 rounded-xl p-3 w-72 shrink-0">
                  <div class="flex justify-between text-sm font-semibold mb-2"><span x-text="label(et)"></span><span class="text-slate-500" x-text="(db.prospectos||[]).filter(p=>p.etapa===et).length"></span></div>
                  <template x-for="p in (db.prospectos||[]).filter(p=>p.etapa===et)" :key="p.id">
                    <div class="bg-white rounded-lg shadow-sm p-3 mb-2 text-sm">
                      <div class="font-semibold cursor-pointer hover:text-teal-700" @click="openForm('prospectos',p)" x-text="p.nombre"></div>
                      <div class="text-xs text-slate-500" x-text="[p.zona,p.telefono].filter(Boolean).join(' · ')"></div>
                      <div class="text-xs mt-1" x-show="p.plan_id" x-text="refName('planes',p.plan_id)"></div>
                      <div class="flex gap-1 mt-2">
                        <button class="text-xs border rounded px-2 py-0.5" @click="moverEtapa(p,-1)">←</button>
                        <button class="text-xs border rounded px-2 py-0.5" @click="moverEtapa(p,1)">→</button>
                        <button x-show="p.etapa!=='ganado'&&p.etapa!=='perdido'" class="text-xs bg-emerald-600 text-white rounded px-2 py-0.5 ml-auto" @click="convertirProspecto(p)">Convertir en cliente</button>
                      </div>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- ======== FINANZAS RESUMEN ======== -->
        <template x-if="mod==='finanzas' && tab==='resumen'">
          <div class="space-y-5">
            <div class="flex items-center gap-2"><label class="text-sm">Mes:</label><input type="month" x-model="mes" class="border rounded-lg px-2 py-1 text-sm bg-white"></div>
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
              <template x-for="k in finKpis()" :key="k.l">
                <div class="bg-white rounded-xl shadow-sm p-4"><div class="text-xs uppercase text-slate-500" x-text="k.l"></div><div class="text-2xl font-bold" :class="k.c" x-text="k.v"></div></div>
              </template>
            </div>
            <div class="grid lg:grid-cols-2 gap-5">
              <template x-for="tipo in ['ingreso','egreso']" :key="tipo">
                <div class="bg-white rounded-xl shadow-sm p-5">
                  <div class="font-semibold mb-3" x-text="tipo==='ingreso'?'Ingresos por categoría':'Egresos por categoría'"></div>
                  <template x-for="r in porCategoria(tipo)" :key="r.cat">
                    <div class="mb-2"><div class="flex justify-between text-xs mb-1"><span x-text="label(r.cat)"></span><span x-text="money(r.v)"></span></div>
                    <div class="bar" :class="tipo==='ingreso'?'bg-emerald-500':'bg-rose-400'" :style="'width:'+pct(r.v,r.max)+'%'"></div></div>
                  </template>
                  <div x-show="!porCategoria(tipo).length" class="text-sm text-slate-500">Sin movimientos este mes.</div>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- ======== CONTABILIDAD: BALANZA / RESULTADOS ======== -->
        <template x-if="mod==='contabilidad' && (tab==='balanza'||tab==='resultados')">
          <div class="space-y-4">
            <div class="flex items-center gap-2 no-print"><label class="text-sm">Periodo:</label><input type="month" x-model="mes" class="border rounded-lg px-2 py-1 text-sm bg-white">
              <label class="text-sm flex items-center gap-1"><input type="checkbox" x-model="acumulado"> Acumulado (todo el historial hasta el mes)</label>
              <button onclick="window.print()" class="ml-auto border rounded-lg px-3 py-1.5 text-sm bg-white">Imprimir</button></div>
            <div x-show="tab==='balanza'" class="bg-white rounded-xl shadow-sm overflow-x-auto">
              <table class="tbl w-full text-sm">
                <thead><tr class="text-left text-slate-500"><th class="p-3">Cuenta</th><th class="p-3">Nombre</th><th class="p-3 text-right">Cargos</th><th class="p-3 text-right">Abonos</th><th class="p-3 text-right">Saldo</th></tr></thead>
                <tbody>
                  <template x-for="r in balanza()" :key="r.codigo">
                    <tr class="border-t"><td class="p-3 font-mono" x-text="r.codigo"></td><td class="p-3" x-text="r.nombre"></td><td class="p-3 text-right" x-text="money(r.cargos)"></td><td class="p-3 text-right" x-text="money(r.abonos)"></td><td class="p-3 text-right font-semibold" x-text="money(r.saldo)"></td></tr>
                  </template>
                  <tr class="border-t-2 font-bold"><td class="p-3" colspan="2">Totales</td><td class="p-3 text-right" x-text="money(balanza().reduce((a,r)=>a+r.cargos,0))"></td><td class="p-3 text-right" x-text="money(balanza().reduce((a,r)=>a+r.abonos,0))"></td><td></td></tr>
                </tbody>
              </table>
            </div>
            <div x-show="tab==='resultados'" class="bg-white rounded-xl shadow-sm p-6 max-w-2xl">
              <div class="text-center mb-4"><div class="font-bold text-lg">Mayalink · Estado de resultados</div><div class="text-sm text-slate-500" x-text="acumulado?('Acumulado al '+mes):('Periodo '+mes)"></div></div>
              <template x-for="sec in resultados().secciones" :key="sec.t">
                <div class="mb-4"><div class="font-semibold border-b pb-1 mb-1" x-text="sec.t"></div>
                  <template x-for="r in sec.rows" :key="r.codigo"><div class="flex justify-between text-sm py-0.5"><span x-text="r.codigo+' '+r.nombre"></span><span x-text="money(r.saldo)"></span></div></template>
                  <div class="flex justify-between font-semibold text-sm pt-1"><span x-text="'Total '+sec.t.toLowerCase()"></span><span x-text="money(sec.total)"></span></div></div>
              </template>
              <div class="flex justify-between text-lg font-bold border-t-2 pt-2" :class="resultados().utilidad>=0?'text-emerald-700':'text-rose-700'"><span>Utilidad (pérdida) del periodo</span><span x-text="money(resultados().utilidad)"></span></div>
            </div>
          </div>
        </template>

        <!-- ======== INVENTARIO RESUMEN ======== -->
        <template x-if="mod==='inventario' && tab==='existencias'">
          <div class="bg-white rounded-xl shadow-sm overflow-x-auto">
            <table class="tbl w-full text-sm">
              <thead><tr class="text-left text-slate-500"><th class="p-3">Tipo</th><th class="p-3">Marca / modelo</th><th class="p-3 text-right">En almacén</th><th class="p-3 text-right">Instalados</th><th class="p-3 text-right">Reparación / dañados</th><th class="p-3 text-right">Valor en almacén</th></tr></thead>
              <tbody><template x-for="r in existencias()" :key="r.k">
                <tr class="border-t"><td class="p-3" x-text="label(r.tipo)"></td><td class="p-3" x-text="r.modelo"></td><td class="p-3 text-right font-semibold" :class="r.almacen<=2&&'text-rose-700'" x-text="r.almacen"></td><td class="p-3 text-right" x-text="r.instalado"></td><td class="p-3 text-right" x-text="r.otros"></td><td class="p-3 text-right" x-text="money(r.valor)"></td></tr>
              </template></tbody>
            </table>
            <div x-show="!existencias().length" class="p-6 text-sm text-slate-500">Sin equipos registrados.</div>
          </div>
        </template>

        <!-- ======== CONFIG ======== -->
        <template x-if="mod==='config'">
          <div class="bg-white rounded-xl shadow-sm p-6 max-w-2xl space-y-4">
            <div><div class="font-semibold">Conexión</div>
              <div class="text-sm text-slate-600" x-text="cfg.demo?'Modo demostración: los datos viven solo en este navegador.':('API: '+cfg.api)"></div></div>
            <div><div class="font-semibold mb-1">Respaldo</div>
              <button @click="exportar()" class="border rounded-lg px-3 py-1.5 text-sm">Descargar respaldo (JSON)</button></div>
            <div x-show="cfg.demo"><div class="font-semibold mb-1">Datos de demostración</div>
              <button @click="resetDemo()" class="border rounded-lg px-3 py-1.5 text-sm text-rose-700">Reiniciar datos de ejemplo</button></div>
            <div class="text-sm text-slate-600"><div class="font-semibold text-slate-800 mb-1">Automatizaciones en n8n</div>
              <ul class="list-disc ml-5 space-y-1">
                <li><b>Facturación mensual</b>: cada día genera la factura de los clientes activos cuyo día de corte ya llegó y aún no tienen factura del mes, con su póliza contable.</li>
                <li><b>Cobranza</b>: cada día marca como vencidas las facturas que pasaron su fecha límite y suspende a los clientes con más días de atraso que la gracia configurada.</li>
              </ul></div>
          </div>
        </template>

        <!-- ======== TABS + GENERIC CRUD ======== -->
        <template x-if="curModule().tabs && !(mod==='crm'&&crmView==='kanban')">
          <div>

            <template x-if="S.tablas[tab]">
              <div class="bg-white rounded-xl shadow-sm">
                <div class="flex flex-wrap items-center gap-2 p-3 border-b">
                  <button @click="openForm(tab)" class="bg-teal-600 hover:bg-teal-700 text-white rounded-lg px-4 py-2 text-sm font-semibold">+ Nuevo</button>
                  <template x-if="tab==='facturas'"><button @click="facturarMes()" class="border rounded-lg px-3 py-2 text-sm">⚡ Generar facturación del mes</button></template>
                  <template x-if="tab==='nomina'"><button @click="generarNomina()" class="border rounded-lg px-3 py-2 text-sm">⚡ Generar nómina del mes</button></template>
                  <template x-if="tab==='cuentas' && !(db.cuentas||[]).length"><button @click="cargarCatalogo()" class="border rounded-lg px-3 py-2 text-sm">Cargar catálogo base</button></template>
                  <template x-if="tab==='prospectos'"><button @click="crmView='kanban'" class="border rounded-lg px-3 py-2 text-sm">Ver tablero</button></template>
                  <input x-model="q" placeholder="Buscar…" class="border rounded-lg px-3 py-2 text-sm flex-1 min-w-[10rem]">
                  <template x-if="filterField(tab)">
                    <select x-model="fil" class="border rounded-lg px-2 py-2 text-sm">
                      <option value="">Todos</option>
                      <template x-for="o in filterField(tab).op.filter(Boolean)" :key="o"><option :value="o" x-text="label(o)"></option></template>
                    </select>
                  </template>
                  <span class="text-xs text-slate-500" x-text="rows(tab).length+' registros'"></span>
                </div>
                <div class="overflow-x-auto max-h-[70vh]">
                  <table class="tbl w-full text-sm">
                    <thead><tr class="text-left text-slate-500">
                      <th class="p-3">#</th>
                      <template x-for="f in listFields(tab)" :key="f.n"><th class="p-3 cursor-pointer select-none whitespace-nowrap" :class="isNum(f)&&'text-right'" @click="sortBy(f.n)" x-text="f.l+(sort.k===f.n?(sort.d>0?' ▲':' ▼'):'')"></th></template>
                      <th class="p-3"></th>
                    </tr></thead>
                    <tbody>
                      <template x-for="r in rows(tab)" :key="tab+'-'+r.id">
                        <tr class="border-t hover:bg-slate-50">
                          <td class="p-3 text-slate-400" x-text="r.id"></td>
                          <template x-for="f in listFields(tab)" :key="f.n">
                            <td class="p-3" :class="isNum(f)&&'text-right whitespace-nowrap'">
                              <template x-if="f.t==='select'"><span class="chip" :class="chipClass(f.n,r[f.n])" x-text="label(r[f.n])"></span></template>
                              <template x-if="f.t!=='select'"><span x-text="fmt(f,r[f.n])"></span></template>
                            </td>
                          </template>
                          <td class="p-3 whitespace-nowrap text-right">
                            <template x-if="tab==='facturas' && ['pendiente','vencida'].includes(r.estado)"><button @click="cobrar(r)" class="text-xs bg-emerald-600 text-white rounded px-2 py-1 mr-1">Cobrar</button></template>
                            <template x-if="tab==='facturas'"><button @click="recibo(r)" class="text-xs border rounded px-2 py-1 mr-1">Imprimir</button></template>
                            <template x-if="tab==='clientes' && r.estado==='activo'"><button @click="facturarCliente(r)" class="text-xs border rounded px-2 py-1 mr-1">Facturar</button></template>
                            <template x-if="tab==='clientes' && r.estado==='instalacion'"><button @click="activarCliente(r)" class="text-xs bg-emerald-600 text-white rounded px-2 py-1 mr-1">Activar</button></template>
                            <template x-if="tab==='prospectos' && !['ganado','perdido'].includes(r.etapa)"><button @click="convertirProspecto(r)" class="text-xs bg-emerald-600 text-white rounded px-2 py-1 mr-1">Convertir</button></template>
                            <template x-if="tab==='nomina' && r.estado!=='pagada'"><button @click="pagarNomina(r)" class="text-xs bg-emerald-600 text-white rounded px-2 py-1 mr-1">Pagar</button></template>
                            <button @click="openForm(tab,r)" class="text-xs border rounded px-2 py-1">Editar</button>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                  <div x-show="!rows(tab).length" class="p-8 text-center text-sm text-slate-500">No hay registros todavía.</div>
                </div>
              </div>
            </template>
          </div>
        </template>
      </div>
    </main>
  </div>

  <!-- ============ FORM MODAL ============ -->
  <div x-show="form.open" class="fixed inset-0 bg-black/40 z-50 flex items-start md:items-center justify-center p-4 overflow-y-auto" @keydown.escape.window="form.open=false">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl" @click.outside="form.open=false">
      <div class="flex items-center justify-between px-6 py-4 border-b">
        <div class="font-bold" x-text="(form.row.id?'Editar':'Nuevo')+' · '+(S.tablas[form.table]?.titulo||'')"></div>
        <button @click="form.open=false" class="text-2xl leading-none text-slate-400">×</button>
      </div>
      <form @submit.prevent="save()" class="p-6 grid md:grid-cols-2 gap-4 max-h-[70vh] overflow-y-auto">
        <template x-for="f in (S.tablas[form.table]?.campos||[])" :key="f.n">
          <div :class="(f.t==='textarea')&&'md:col-span-2'">
            <label class="block text-xs font-medium text-slate-600 mb-1" x-text="f.l+(f.req?' *':'')"></label>
            <template x-if="f.t==='textarea'"><textarea x-model="form.row[f.n]" rows="2" class="w-full border rounded-lg px-3 py-2 text-sm"></textarea></template>
            <template x-if="f.t==='select'"><select x-model="form.row[f.n]" class="w-full border rounded-lg px-3 py-2 text-sm"><template x-for="o in f.op" :key="o"><option :value="o" x-text="o?label(o):'—'" :selected="form.row[f.n]===o"></option></template></select></template>
            <template x-if="f.t==='ref'"><select x-model="form.row[f.n]" class="w-full border rounded-lg px-3 py-2 text-sm"><option value="">—</option><template x-for="o in (db[f.ref]||[])" :key="o.id"><option :value="String(o.id)" x-text="refLabel(f.ref,o)" :selected="String(form.row[f.n])===String(o.id)"></option></template></select></template>
            <template x-if="f.t==='cuenta'"><select x-model="form.row[f.n]" class="w-full border rounded-lg px-3 py-2 text-sm"><option value="">—</option><template x-for="o in cuentasOrdenadas()" :key="o.id"><option :value="o.codigo" x-text="o.codigo+' '+o.nombre" :selected="form.row[f.n]===o.codigo"></option></template></select></template>
            <template x-if="f.t==='bool'"><label class="flex items-center gap-2 text-sm py-2"><input type="checkbox" x-model="form.row[f.n]"> Sí</label></template>
            <template x-if="['text','email','tel','number','money','date'].includes(f.t)">
              <input x-model="form.row[f.n]" :type="f.t==='money'?'number':(f.t==='tel'?'tel':f.t)" :step="f.t==='money'?'0.01':'any'" :required="f.req" class="w-full border rounded-lg px-3 py-2 text-sm">
            </template>
          </div>
        </template>
        <div class="md:col-span-2 flex items-center gap-2 pt-2">
          <button type="submit" class="bg-teal-600 hover:bg-teal-700 text-white rounded-lg px-5 py-2 font-semibold text-sm" :disabled="busy">Guardar</button>
          <button type="button" @click="form.open=false" class="border rounded-lg px-4 py-2 text-sm">Cancelar</button>
          <button type="button" x-show="form.row.id" @click="remove()" class="ml-auto text-rose-700 text-sm hover:underline">Eliminar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ============ COBRO MODAL ============ -->
  <div x-show="pago.open" class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 space-y-3" @click.outside="pago.open=false">
      <div class="font-bold">Registrar cobro</div>
      <div class="text-sm" x-text="(pago.f?.folio||'')+' · '+refName('clientes',pago.f?.cliente_id)"></div>
      <div class="text-2xl font-bold" x-text="money(pago.f?.total)"></div>
      <label class="block text-xs font-medium">Método</label>
      <select x-model="pago.metodo" class="w-full border rounded-lg px-3 py-2 text-sm"><template x-for="o in ['efectivo','transferencia','deposito','tarjeta','oxxo']" :key="o"><option :value="o" x-text="label(o)"></option></template></select>

const hoy = () => new Date().toLocaleDateString('en-CA');
const mesActual = () => hoy().slice(0,7);
const sumarDias = (iso, n) => { const d = new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.toLocaleDateString('en-CA'); };
const r2 = n => Math.round((Number(n)||0)*100)/100;

function erp(){ return {
  S: SCHEMA, modules: MODULES, mod:'tablero', tab:null, crmView:'kanban', menuOpen:false,
  db:{}, ready:false, busy:false, loginError:'', q:'', fil:'', sort:{k:null,d:1}, mes: mesActual(), acumulado:false,
  cfg:{ api:'', token:'', demo:false },
  chat:{ open:false, visto:false, msgs:[], text:'', loading:false, sesion:'' },
  form:{ open:false, table:null, row:{} }, pago:{ open:false, f:null, metodo:'efectivo', fecha:hoy() }, toast:{ msg:'', err:false },

  // ---------- arranque / sesión ----------
  init(){
    try { Object.assign(this.cfg, JSON.parse(localStorage.getItem('mayalink_cfg')||'{}')); } catch(e){}
    if (!this.cfg.api && location.protocol.startsWith('http') && location.pathname.includes('/webhook')) {
      this.cfg.api = location.origin + location.pathname.replace(/\/+$/,'') + '/api';
    }
    if (this.cfg.demo || this.cfg.token) this.loadAll().then(ok => { if (ok) this.ready = true; });
    this.$watch('tab', () => { this.q=''; this.fil=''; this.sort={k:null,d:1}; });
  },
  saveCfg(){ try { localStorage.setItem('mayalink_cfg', JSON.stringify(this.cfg)); } catch(e){} },
  async login(){
    this.cfg.demo=false; this.loginError='';
    if (!this.cfg.api || !this.cfg.token) { this.loginError='Escribe la URL de la API y la clave.'; return; }
    const ok = await this.loadAll(true);
    if (ok) { this.saveCfg(); this.ready=true; }
  },
  startDemo(){ this.cfg.demo=true; this.saveCfg(); if (!localStorage.getItem('mayalink_demo')) this.seedDemo(); this.loadAll().then(()=>this.ready=true); },
  logout(){ this.cfg.token=''; this.cfg.demo=false; this.saveCfg(); this.ready=false; this.db={}; },
  go(id){ this.mod=id; this.menuOpen=false; const m=this.curModule(); this.tab = m.tabs ? m.tabs[0] : null; if(id==='crm') this.crmView='kanban'; },
  curModule(){ return this.modules.find(m=>m.id===this.mod) || this.modules[0]; },
  tabLabel(t){ return TAB_LABELS[t] || t; },

  // ---------- asistente (chat con n8n: POST <api>/../chat) ----------
  chatUrl(){ return String(this.cfg.api||'').replace(/\/api\/?$/, '/chat'); },
  chatToggle(){ this.chat.open=!this.chat.open; this.chat.visto=true; if (this.chat.open) this.$nextTick(()=>this.chatScroll()); },
  chatNueva(){ this.chat.msgs=[]; this.chat.sesion=''; this.chat.text=''; },
  chatScroll(){ const el=this.$refs.chatLog; if (el) el.scrollTop=el.scrollHeight; },
  chatSugerencias(){
    const porModulo = { facturas:'¿Cómo registro el pago de una factura?', contabilidad:'¿Qué póliza se genera al cobrar una factura?', crm:'¿Cómo convierto un prospecto en cliente?',
      clientes:'¿Cuándo se suspende a un cliente?', soporte:'¿Qué tickets urgentes hay abiertos?', inventario:'¿Qué equipos hay en almacén?', rrhh:'¿Qué hace cada departamento?', finanzas:'¿Cómo registro un gasto?' };
    return [porModulo[this.mod] || '¿Qué puedo hacer en cada módulo del sistema?', '¿Qué facturas están vencidas?', '¿Qué planes de internet tenemos y cuánto cuestan?'];
  },
  chatFormato(t){
    const esc = String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return esc.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^#{1,4}\s*(.+)$/gm,'<b>$1</b>').replace(/^\s*[-*]\s+/gm,'• ').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>')
      .replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener" class="text-teal-700 underline">$1</a>').replace(/\n/g,'<br>');
  },
  async chatEnviar(texto){
    const msg = String(texto!==undefined ? texto : this.chat.text).trim();
    if (!msg || this.chat.loading) return;
    this.chat.text=''; this.chat.msgs.push({ de:'yo', texto:msg }); this.chat.loading=true; this.$nextTick(()=>this.chatScroll());
    if (!this.chat.sesion) this.chat.sesion = 'crm-' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
    try {
      if (this.cfg.demo) throw new Error('Mayito necesita la conexión con n8n. En modo demostración no está disponible.');
      const res = await fetch(this.chatUrl(), { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ token:this.cfg.token, mensaje:msg, sesion:this.chat.sesion, modulo:this.mod }) });
      let j=null; try { j = await res.json(); } catch(e) {}
      if (!res.ok || !j || j.ok===false) throw new Error((j && j.error) || ('Mayito no respondió (HTTP '+res.status+').'));
      this.chat.msgs.push({ de:'bot', texto:j.respuesta || 'No tengo respuesta para eso.' });
    } catch(e) { this.chat.msgs.push({ de:'bot', texto:e.message, error:true }); }
    this.chat.loading=false; this.$nextTick(()=>this.chatScroll());
  },

  // ---------- capa de datos: API n8n o demo local ----------
  async api(action, table, id, data){
    if (this.cfg.demo) return this.demoApi(action, table, id, data);
    const res = await fetch(this.cfg.api, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ token:this.cfg.token, action, table, id, data }) });
    let j = null; try { j = await res.json(); } catch(e) {}
    if (!res.ok || !j || j.ok === false) throw new Error((j && j.error) || ('Error HTTP '+res.status));
    return j;
  },
  async loadAll(fromLogin){
    this.busy=true;
    try {
      const names = Object.keys(this.S.tablas);
      const out = await Promise.all(names.map(t => this.api('list', t)));
      const db = {}; names.forEach((t,i)=> db[t] = out[i].rows || []);
      this.db = db; this.loginError='';
      return true;
    } catch(e) {
      if (fromLogin) this.loginError = 'No se pudo conectar: '+e.message; else this.notify('Error al cargar: '+e.message, true);
      return false;
    } finally { this.busy=false; }
  },
  async create(table, data){ const j = await this.api('create', table, null, this.clean(table,data)); this.db[table].push(j.row); return j.row; },
  async update(table, id, data){ const j = await this.api('update', table, id, this.clean(table,data)); const i=this.db[table].findIndex(r=>r.id===id); if(i>=0) this.db[table][i] = Object.assign({}, this.db[table][i], j.row||data); return this.db[table][i]; },
  async del(table, id){ await this.api('delete', table, id); this.db[table] = this.db[table].filter(r=>r.id!==id); },
  clean(table, data){
    const o = {};
    for (const f of this.S.tablas[table].campos) {
      if (!(f.n in data)) continue;
      let v = data[f.n];
      if (['number','money','ref'].includes(f.t)) v = (v===''||v===null||v===undefined) ? null : Number(v);
      else if (f.t==='bool') v = !!v;
      else v = (v===null||v===undefined) ? '' : String(v);
      o[f.n] = v;
    }
    return o;
  },

  // demo: misma interfaz que la API, guardada en localStorage
  demoLoad(){ try { return JSON.parse(localStorage.getItem('mayalink_demo')||'{}'); } catch(e){ return {}; } },
  demoApi(action, table, id, data){
    const d = this.demoLoad(); d[table] = d[table] || []; const now = new Date().toISOString();
    if (action==='list') return { ok:true, rows: d[table] };
    if (action==='create') { const nid = d[table].reduce((m,r)=>Math.max(m,r.id),0)+1; const row = Object.assign({id:nid, createdAt:now, updatedAt:now}, data); d[table].push(row); localStorage.setItem('mayalink_demo', JSON.stringify(d)); return { ok:true, row }; }

  // ---------- utilidades de presentación ----------
  money(n){ return (Number(n)||0).toLocaleString('es-MX',{style:'currency',currency:'MXN'}); },
  pct(v,max){ return (max && v) ? Math.max(2, Math.round(v/max*100)) : 0; },
  label(v){ if(v===null||v===undefined||v==='') return '—'; return LABELS[v] || (String(v).charAt(0).toUpperCase()+String(v).slice(1).replace(/_/g,' ')); },
  chipClass(k,v){ return CHIP[v] || 'bg-slate-100 text-slate-700'; },
  field(t,n){ return this.S.tablas[t].campos.find(f=>f.n===n); },
  isNum(f){ return ['number','money'].includes(f.t); },
  listFields(t){ return this.S.tablas[t].campos.filter(f=>f.lista); },
  filterField(t){ return this.S.tablas[t].campos.find(f=>f.t==='select' && f.n==='estado') || this.S.tablas[t].campos.find(f=>f.t==='select' && f.lista); },
  refLabel(t,o){ return o.nombre || [o.folio,o.marca,o.modelo].filter(Boolean).join(' ') || ('#'+o.id); },
  refName(t,id){ if(id===null||id===undefined||id==='') return '—'; const o=(this.db[t]||[]).find(r=>String(r.id)===String(id)); return o ? this.refLabel(t,o) : '#'+id; },
  cuentasOrdenadas(){ return [...(this.db.cuentas||[])].sort((a,b)=>String(a.codigo).localeCompare(String(b.codigo))); },
  fmt(f,v){
    if (f.t==='money') return this.money(v);
    if (f.t==='ref') return this.refName(f.ref,v);
    if (f.t==='bool') return v ? 'Sí' : 'No';
    if (f.t==='cuenta') { const c=(this.db.cuentas||[]).find(c=>c.codigo===v); return c ? v+' '+c.nombre : (v||'—'); }
    return (v===null||v===undefined||v==='') ? '—' : v;
  },
  sortBy(k){ this.sort = { k, d: this.sort.k===k ? -this.sort.d : 1 }; },
  rows(t){
    let rs = this.db[t] || [];
    const ff = this.filterField(t);
    if (this.fil && ff) rs = rs.filter(r=>r[ff.n]===this.fil);
    if (this.q) { const q=this.q.toLowerCase(); const fs=this.S.tablas[t].campos;
      rs = rs.filter(r => fs.some(f => String(this.fmt(f,r[f.n])).toLowerCase().includes(q))); }
    const k=this.sort.k, d=this.sort.d;
    return [...rs].sort((a,b)=> k ? ((a[k]??'')>(b[k]??'')?d:(a[k]??'')<(b[k]??'')?-d:0) : b.id-a.id);
  },
  notify(msg, err){ this.toast={msg,err:!!err}; clearTimeout(this._tt); this._tt=setTimeout(()=>this.toast.msg='', err?6000:3000); },
  async run(fn, okMsg){ this.busy=true; try { const r = await fn(); if(okMsg) this.notify(okMsg); return r; } catch(e){ this.notify('Error: '+e.message, true); } finally { this.busy=false; } },
  nextFolio(t, pre){ const n=(this.db[t]||[]).reduce((m,r)=>Math.max(m, parseInt(String(r.folio||'').replace(/\D/g,''))||0),0)+1; return pre+String(n).padStart(4,'0'); },

  // ---------- formulario genérico ----------
  openForm(table, row){
    const r = {};
    for (const f of this.S.tablas[table].campos) {
      if (row) r[f.n] = (f.t==='ref' && row[f.n]!=null) ? String(row[f.n]) : (row[f.n] ?? '');
      else r[f.n] = f.def==='hoy' ? hoy() : (f.def ?? (f.t==='bool'?false:''));
    }
    if (row) r.id = row.id;
    if (!row && table==='facturas') { r.folio=this.nextFolio('facturas','F-'); r.periodo=mesActual(); r.fecha_vencimiento=sumarDias(hoy(),DIAS_PARA_PAGAR); }
    if (!row && table==='tickets') r.folio=this.nextFolio('tickets','T-');
    if (!row && table==='nomina') r.periodo=mesActual();
    this.form = { open:true, table, row:r };
  },
  async save(){
    const t=this.form.table, r={...this.form.row}, id=r.id; delete r.id;
    for (const f of this.S.tablas[t].campos) if (f.req && (r[f.n]===''||r[f.n]===null)) return this.notify('Falta: '+f.l, true);
    if (t==='facturas' && r.total && !r.subtotal) { r.subtotal=r2(r.total/(1+IVA)); r.iva=r2(r.total-r.subtotal); }
    if (t==='nomina') r.neto = r2((+r.salario_base||0)+(+r.bonos||0)-(+r.deducciones||0));
    if (t==='tickets' && ['resuelto','cerrado'].includes(r.estado) && !r.fecha_cierre) r.fecha_cierre=hoy();
    await this.run(async ()=>{
      if (id) await this.update(t,id,r);
      else {
        const row = await this.create(t,r);
        if (t==='movimientos') await this.polizaMovimiento(row);
        if (t==='facturas') await this.polizaFactura(row);
      }
      this.form.open=false;
    }, 'Guardado');
  },
  async remove(){
    if (!confirm('¿Eliminar este registro? No se puede deshacer.')) return;
    await this.run(async()=>{ await this.del(this.form.table, this.form.row.id); this.form.open=false; }, 'Eliminado');
  },

  // ---------- contabilidad automática ----------
  async polizaMovimiento(m){
    const caja = m.cuenta==='caja' ? '101' : '102', contra = CUENTA_CATEGORIA[m.categoria] || (m.tipo==='ingreso'?'403':'699');
    await this.create('asientos', { fecha:m.fecha, concepto:m.descripcion||this.label(m.categoria), referencia:m.referencia||('MOV-'+m.id),
      cuenta_cargo: m.tipo==='ingreso'?caja:contra, cuenta_abono: m.tipo==='ingreso'?contra:caja, monto:m.monto });
  },
  async polizaFactura(f){
    const sub = f.subtotal || r2(f.total/(1+IVA)), iva = f.iva ?? r2(f.total-sub);
    await this.create('asientos', { fecha:f.fecha_emision||hoy(), concepto:'Factura '+f.folio, cuenta_cargo:'105', cuenta_abono:'401', monto:sub, referencia:f.folio });
    if (iva) await this.create('asientos', { fecha:f.fecha_emision||hoy(), concepto:'IVA factura '+f.folio, cuenta_cargo:'105', cuenta_abono:'208', monto:iva, referencia:f.folio });
  },
  cargarCatalogo(){ this.run(async()=>{ for (const c of CATALOGO_BASE) await this.create('cuentas', c); }, 'Catálogo cargado'); },

  // ---------- facturación y cobranza ----------
  async emitirFactura(c){
    const plan = (this.db.planes||[]).find(p=>p.id===c.plan_id);
    if (!plan) throw new Error(c.nombre+' no tiene plan asignado');
    const total = Number(plan.precio), subtotal = r2(total/(1+IVA));
    const f = await this.create('facturas', { folio:this.nextFolio('facturas','F-'), cliente_id:c.id, periodo:mesActual(), concepto:'Servicio de internet '+plan.nombre,
      fecha_emision:hoy(), fecha_vencimiento:sumarDias(hoy(),DIAS_PARA_PAGAR), subtotal, iva:r2(total-subtotal), total, estado:'pendiente', fecha_pago:'', metodo_pago:'' });
    await this.polizaFactura(f); return f;
  },
  yaFacturado(c){ return (this.db.facturas||[]).some(f=>f.cliente_id===c.id && f.periodo===mesActual() && f.estado!=='cancelada'); },
  facturarCliente(c){
    if (this.yaFacturado(c) && !confirm(c.nombre+' ya tiene factura de este mes. ¿Emitir otra?')) return;
    this.run(()=>this.emitirFactura(c), 'Factura emitida');
  },
  facturarMes(){
    const pend = (this.db.clientes||[]).filter(c=>c.estado==='activo' && !this.yaFacturado(c));
    if (!pend.length) return this.notify('Todos los clientes activos ya tienen factura de '+mesActual());
    if (!confirm('Se emitirán '+pend.length+' facturas del periodo '+mesActual()+'. ¿Continuar?')) return;
    this.run(async()=>{ for (const c of pend) await this.emitirFactura(c); }, pend.length+' facturas emitidas');
  },
  cobrar(f){ this.pago = { open:true, f, metodo:'efectivo', fecha:hoy() }; },
  async confirmarCobro(){

      await this.update('facturas', f.id, { estado:'pagada', fecha_pago:p.fecha, metodo_pago:p.metodo });
      const mov = await this.create('movimientos', { fecha:p.fecha, tipo:'ingreso', categoria:'cobro_servicio', descripcion:'Cobro '+f.folio+' · '+this.refName('clientes',f.cliente_id),
        monto:f.total, cuenta:p.metodo==='efectivo'?'caja':'banco', referencia:f.folio });

        { await this.update('clientes', c.id, { estado:'activo' }); this.notify('Cliente reactivado'); }

  ticketsAbiertos(){ const o={urgente:0,alta:1,media:2,baja:3}; return (this.db.tickets||[]).filter(t=>['abierto','en_proceso'].includes(t.estado)).sort((a,b)=>(o[a.prioridad]??9)-(o[b.prioridad]??9)); },

  kpis(){
    const cl=this.db.clientes||[], fa=this.db.facturas||[], m=mesActual(), mv=this.movsMes(m);
    const ing=mv.filter(x=>x.tipo==='ingreso').reduce((a,x)=>a+(+x.monto||0),0), egr=mv.filter(x=>x.tipo==='egreso').reduce((a,x)=>a+(+x.monto||0),0);

    return [
      { l:'Clientes activos', v:cl.filter(c=>c.estado==='activo').length, s:cl.filter(c=>c.estado==='suspendido').length+' suspendidos · '+cl.filter(c=>c.estado==='instalacion').length+' por instalar' },

    ];

    const out=[]; let d=new Date(); d.setDate(1);
    for (let i=0;i<6;i++){ const m=d.toLocaleDateString('en-CA').slice(0,7); const mv=this.movsMes(m);
      out.unshift({ mes:m, ing:mv.filter(x=>x.tipo==='ingreso').reduce((a,x)=>a+(+x.monto||0),0), egr:mv.filter(x=>x.tipo==='egreso').reduce((a,x)=>a+(+x.monto||0),0) }); d.setMonth(d.getMonth()-1); }
    const max=Math.max(1,...out.map(r=>Math.max(r.ing,r.egr))); out.forEach(r=>r.max=max); return out;
  },
  clientesPorPlan(){
    const g={}; (this.db.clientes||[]).filter(c=>c.estado==='activo').forEach(c=>{ const p=(this.db.planes||[]).find(p=>p.id===c.plan_id); const k=p?p.nombre:'Sin plan'; g[k]=g[k]||{plan:k,n:0,mrr:0}; g[k].n++; g[k].mrr+=p?+p.precio:0; });
    const rs=Object.values(g).sort((a,b)=>b.n-a.n); const max=Math.max(1,...rs.map(r=>r.n)); rs.forEach(r=>r.max=max); return rs;
  },
  finKpis(){ const mv=this.movsMes(this.mes); const ing=mv.filter(x=>x.tipo==='ingreso').reduce((a,x)=>a+(+x.monto||0),0), egr=mv.filter(x=>x.tipo==='egreso').reduce((a,x)=>a+(+x.monto||0),0);
    const saldo=c=>(this.db.movimientos||[]).filter(x=>x.cuenta===c).reduce((a,x)=>a+(x.tipo==='ingreso'?1:-1)*(+x.monto||0),0);
    return [ {l:'Ingresos',v:this.money(ing),c:'text-emerald-700'}, {l:'Egresos',v:this.money(egr),c:'text-rose-700'}, {l:'Resultado',v:this.money(ing-egr),c:ing-egr<0?'text-rose-700':''}, {l:'Saldo caja / banco',v:this.money(saldo('caja'))+' / '+this.money(saldo('banco')),c:'!text-base'} ]; },
  porCategoria(tipo){ const g={}; this.movsMes(this.mes).filter(x=>x.tipo===tipo).forEach(x=>g[x.categoria]=(g[x.categoria]||0)+(+x.monto||0));
    const rs=Object.entries(g).map(([cat,v])=>({cat,v})).sort((a,b)=>b.v-a.v); const max=Math.max(1,...rs.map(r=>r.v)); rs.forEach(r=>r.max=max); return rs; },
  asientosPeriodo(){ return (this.db.asientos||[]).filter(a=> this.acumulado ? String(a.fecha||'').slice(0,7)<=this.mes : String(a.fecha||'').startsWith(this.mes)); },
  balanza(){
    const as=this.asientosPeriodo();
    return this.cuentasOrdenadas().map(c=>{ const cargos=as.filter(a=>a.cuenta_cargo===c.codigo).reduce((s,a)=>s+(+a.monto||0),0), abonos=as.filter(a=>a.cuenta_abono===c.codigo).reduce((s,a)=>s+(+a.monto||0),0);
      return { codigo:c.codigo, nombre:c.nombre, tipo:c.tipo, cargos, abonos, saldo: c.naturaleza==='acreedora' ? abonos-cargos : cargos-abonos }; }).filter(r=>r.cargos||r.abonos);
  },
  resultados(){
    const b=this.balanza(); const ing=b.filter(r=>r.tipo==='ingreso'), gas=b.filter(r=>r.tipo==='gasto');
    const ti=ing.reduce((a,r)=>a+r.saldo,0), tg=gas.reduce((a,r)=>a+r.saldo,0);
    return { secciones:[{t:'Ingresos',rows:ing,total:ti},{t:'Gastos',rows:gas,total:tg}], utilidad:ti-tg };
  },
  existencias(){ const g={}; (this.db.inventario||[]).forEach(i=>{ const k=i.tipo+'|'+(i.marca||'')+' '+(i.modelo||''); g[k]=g[k]||{k,tipo:i.tipo,modelo:((i.marca||'')+' '+(i.modelo||'')).trim()||'—',almacen:0,instalado:0,otros:0,valor:0};
    const q=+i.cantidad||1; if(i.estado==='almacen'){g[k].almacen+=q; g[k].valor+=q*(+i.costo||0);} else if(i.estado==='instalado') g[k].instalado+=q; else if(i.estado!=='baja') g[k].otros+=q; });
    return Object.values(g).sort((a,b)=>String(a.tipo).localeCompare(String(b.tipo))); },
  exportar(){ const blob=new Blob([JSON.stringify(this.db,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='mayalink-respaldo-'+hoy()+'.json'; a.click(); }
}; }
